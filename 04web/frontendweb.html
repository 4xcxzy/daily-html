<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        caption {
            font-weight: 500;
        }

        th,
        td {
            padding: 10px 10px;
            border: 1px solid rgb(140 140 140);
        }

        .h1 {
            text-align: right;
        }

        .d1 {
            text-align: center;
        }

        table {
            border: 3px solid rgb(140 140 140);
            border-collapse: collapse;
        }

        thead,
        tfoot {
            background-color: rgb(228 240 245);
        }

        tbody>tr:nth-child(even) {
            background-color: rgb(237 238 242);
        }

        caption {
            font-weight: 700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>

<body>
    <table>
        <caption>Front-end web developer course 2021</caption>
        <thead>
            <tr>
                <th>Person</th>
                <th>Most interest in</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Chris</th>
                <td>HTML tables</td>
                <td class="d1">22</td>
            </tr>
            <tr>
                <th>Dennis</th>
                <td>Web accessibility</td>
                <td class="d1">45</td>
            </tr>
            <tr>
                <th>Sarah</th>
                <td>JavaScript frameworks</td>
                <td class="d1">29</td>
            </tr>
            <tr>
                <th>Karen</th>
                <td>Web performance</td>
                <td class="d1">36</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2" class="h1">Average age</th>
                <th>33</th>
            </tr>
        </tfoot>
    </table>
</body>

</html>
